name: PR Recap Sync

# Synchronize PR lifecycle with Linear issue state, anchored recap comment,
# and PR diff backlink using Agent-Native PR Recap CLI.

on:
  pull_request:
    types: [opened, ready_for_review, closed]

concurrency:
  group: pr-recap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    name: Sync Linear & GitNexus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run PR Recap Synchronization
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning ::LINEAR_API_KEY secret is not configured; running in dry-run mode."
            python3 scripts/pr_recap.py sync --event-path "$GITHUB_EVENT_PATH" --dry-run
          else
            python3 scripts/pr_recap.py sync --event-path "$GITHUB_EVENT_PATH"
          fi
