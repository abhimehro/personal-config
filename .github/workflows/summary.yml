name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NOTE: ai-inference@v3 dropped GitHub Models and shells out to Copilot
      # CLI, which is not on hosted runners (issues #2042 / ESP #1474).
      # Pin v2.1.1 — same working path as ctrld-sync — until Copilot CLI +
      # COPILOT_GITHUB_TOKEN is an explicit product choice.
      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          prompt: |
            Summarize the following GitHub issue in one paragraph:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

      # SECURITY: the LLM output is attacker-influenceable via prompt injection
      # in the issue body. Write it to a temporary file and use --body-file so no
      # shell interpolation of the response can occur. See issue #892.
      - name: Comment with AI summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          response_file="${RUNNER_TEMP}/ai-summary.md"
          printf '%s\n' "$RESPONSE" > "$response_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$response_file"
