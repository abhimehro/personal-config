name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Advanced Jules PR Reviewer
        # Advisory only: keep fail_on: never without block_on so jules/review
        # check-run conclusions stay non-blocking, and continue-on-error: true
        # so transient Jules API errors do not red the PR.
        continue-on-error: true
        uses: thalesraymond/jules-pr-reviewer@04cb0a36e5d1a5939147845003fb99746833f7b0 # v1.8.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: never
          min_severity_to_report: warning
          strictness: assertive
          skip_drafts: true
          skip_forks: true
          bypass_label: jules-override
          status_context: jules/review
          timeout_minutes: 30
          enable_suggestions: true
          enable_approve: false
          dedupe: true
          large_pr_strategy: prioritize
