# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    # dotenv-linter assumes plain KEY=value syntax; config.env contains POSIX
    # shell (if/fi guards, command substitution, exports) that it corrupts
    # under trunk fmt, re-breaking launchd HOME/USER guards.
    - linters: [dotenv-linter]
      paths:
        - maintenance/conf/config.env
    # Test suites intentionally invoke the scripts under test via
    # subprocess; inputs are repo-local fixtures, not untrusted data.
    - linters: [bandit]
      paths:
        - tests/**
    # Cursor automation prompts are embedded verbatim in exports/*.json;
    # deno fmt reflow breaks sync_cursor_export_prompts.py --check and the
    # export-authority tests.
    - linters: [deno]
      paths:
        - docs/cursor-automations/prompts/**
    # tasks/*.md are machine-parsed run records (session reports, lessons,
    # pr-review/pr-salvage records). deno fmt reflow splits tokens such as
    # "Full record: ..." across lines and breaks test_pr_lifecycle_*.
    - linters: [deno]
      paths:
        - tasks/**/*.md
  disabled:
    - markdownlint
    - prettier
  enabled:
    - grype@0.121.0
    # pinact v5 rejects single-dash -format; trunk plugins v1.11.0 still pass
    # -format via pinact_run.py. Stay on 4.1.1 until plugins emit --format.
    - pinact@4.1.1
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.3.30
    - deno@2.9.8
    - dotenv-linter@4.0.0
    - git-diff-check
    - hadolint@2.15.1
    - isort@9.0.2
    - osv-scanner@2.7.0
    - ruff@0.17.1
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - terrascan@1.19.9
    - trivy@0.76.1
    - trufflehog@3.99.3
    - yamllint@1.38.0
actions:
  definitions:
    - id: pr-recap-sync
      display_name: PR Recap Sync
      description: Synchronize Linear issue with PR lifecycle
      run: scripts/git-hooks/pre-push-pr-recap.sh
      triggers:
        - git_hooks: [pre-push]
    - id: credential-scan
      display_name: Credential Scan
      description: Block commits whose staged content contains a credential (gitleaks)
      run: scripts/git-hooks/pre-commit-credential-scan.sh
      triggers:
        - git_hooks: [pre-commit]
  disabled:
    # trufflehog-pre-commit stays disabled on purpose: credential-scan already
    # owns the pre-commit trigger, and two scanners on one hook means two
    # different allowlists to keep in sync and two chances to block a clean
    # commit. trufflehog remains available via lint/tools and
    # `make verify-credentials` for the whole-repo audit.
    - trufflehog-pre-commit
    - commitlint
    - trunk-check-pre-commit
    - trunk-fmt-pre-commit
  enabled:
    - git-lfs
    - trunk-check-pre-push
    - pr-recap-sync
    - credential-scan
    - trunk-announce
    - trunk-upgrade-available
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
tools:
  disabled:
    - ruby
  enabled:
    - snyk@1.1295.0
    - trivy@0.76.1
    - trufflehog@3.99.3
