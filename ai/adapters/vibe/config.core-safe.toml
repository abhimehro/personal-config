# Portable Vibe fragment. Merge into ~/.vibe/config.toml after review.
# Do not set bypass_tool_permissions = true.
# Do not default to agent auto-approve.
# Official MCP is [[mcp_servers]] below, not ~/.vibe/mcp-servers.json.

bypass_tool_permissions = false
enable_telemetry = false
project_context_enabled = true
default_agent = "default"

# Keep auto-approve available as an explicit --agent, not the default.
# Validate active_model against `vibe` 2.16.1 before changing.
# active_model = "mistral-small-latest"

[tools.bash]
permission = "ask"

[tools.write_file]
permission = "ask"

[tools.task]
permission = "ask"

[tools.skill]
permission = "always"

[tools.exit_plan_mode]
permission = "always"

# MCP servers are generated by:
#   ./scripts/generate-mcp-configs.sh --profile core-safe --dry-run vibe
# OAuth servers (GitHub Copilot MCP, Linear, Notion remote) are skipped for Vibe.
